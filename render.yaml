# GoldPulse AI – online version on Render, FREE plan (works with your PC switched off).
# Render reads this file when you choose  New -> Blueprint  and pick this repository.
#
# Free plan limits: the server sleeps after 15 minutes with no visitors and takes about
# 1 minute to wake up when you open the page again. Files are not kept while it sleeps,
# so the signal journal is rebuilt from price history (JOURNAL_START) each time it wakes.
services:
  - type: web
    name: goldpulse-ai
    runtime: python
    plan: free
    region: singapore        # closest Render region to India
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: MARKET_DATA_PROVIDER
        value: auto
      - key: JOURNAL_START
        value: "2026-11-11T16:53:40Z"   # 11 Nov 2026 22:23 IST – same start as the PC journal
      - key: APP_USERNAME
        value: goldpulse
      - key: APP_PASSWORD     # you type this yourself in Render – never put it in this file
        sync: false
      - key: TWELVEDATA_API_KEY   # leave empty for the free feed; paste your key later in Render
        sync: false
